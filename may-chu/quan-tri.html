<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị – Vườn Xanh</title>
<style>
  :root { --green: #2f6b45; --green-dark: #1f3d2b; --soft: #e8f0e6; --line: #e4e0d4; --bg: #f7f5ef; --muted: #6b766e; --ink: #1f2a22; --red: #b4542f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; }
  header { background: var(--green-dark); color: #fff; }
  .top { max-width: 1200px; margin: auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top b { font-size: 17px; }
  .top a { color: #cfe5c4; text-decoration: none; font-size: 14px; }
  nav.tabs { max-width: 1200px; margin: auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs a { color: #cfe5c4; text-decoration: none; padding: 10px 16px; border-radius: 10px 10px 0 0; white-space: nowrap; font-weight: 500; }
  nav.tabs a.on { background: var(--bg); color: var(--ink); }
  main { max-width: 1200px; margin: auto; padding: 20px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .bar input[type=search] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--green); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.red { background: #fff; color: var(--red); border: 1px solid #ecc9bb; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .help { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: #3a443d; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; }
  .item:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-1px); }
  .item .im { aspect-ratio: 1; background: #f1efe9; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .item.post .im { aspect-ratio: 16/10; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .tx { padding: 10px 12px 12px; display: grid; gap: 2px; }
  .item .tx b { font-size: 14.5px; font-weight: 600; }
  .item .tx span { font-size: 13px; color: var(--muted); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--green); font-weight: 600; }
  .chip.out { background: #f6e3da; color: var(--red); }
  .chip.hot { background: #fbe9dc; color: #b4542f; }
  h2.sub { font-size: 16px; margin: 28px 0 10px; color: var(--muted); }
  .deleted .item { opacity: .6; }
  /* hộp sửa */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(760px, 96vw); max-height: 94vh; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20,30,24,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  .dlg-head h3 { margin: 0; font-size: 18px; }
  .x { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); }
  form.ed { padding: 18px 20px 20px; display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label.f { display: grid; gap: 5px; font-size: 14px; font-weight: 600; }
  label.f small { font-weight: 400; color: var(--muted); }
  .f input, .f textarea, .f select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; font-weight: 400; }
  .f textarea { resize: vertical; }
  .pic { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
  .pic .pv { width: 150px; aspect-ratio: 1; border-radius: 12px; background: #f1efe9; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; }
  .pic .pv img { width: 100%; height: 100%; object-fit: cover; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; font-weight: 400; font-size: 14px; }
  .cats label, .checks label { display: flex; gap: 8px; align-items: center; }
  .checks { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
  .actions div { display: flex; gap: 10px; flex-wrap: wrap; }
  .msg { font-size: 14px; color: var(--red); min-height: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--green-dark); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  /* ---- Đơn hàng & doanh thu ---- */
  #badgeDon:not(:empty) { background: #d0563a; color: #fff; border-radius: 999px; font-size: 12px; padding: 0 7px; margin-left: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; cursor: pointer; font: inherit; }
  .stat small { display: block; color: var(--muted); font-size: 13px; }
  .stat b { display: block; font-size: 24px; margin-top: 2px; }
  .stat em { font-style: normal; font-size: 12.5px; color: var(--muted); }
  .stat.warn b { color: #c4492b; } .stat.money b { color: var(--green); }
  .up { color: #2f6b45 !important; } .down { color: #c4492b !important; }
  .chart { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 10px; margin-bottom: 18px; }
  .chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-h b { font-size: 15px; } .chart-h span { font-size: 13px; color: var(--muted); }
  .bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
  .cot { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: pointer; border: 0; background: none; padding: 0; font: inherit; }
  .cot i { display: block; width: 100%; max-width: 38px; background: #cfe3c9; border-radius: 6px 6px 2px 2px; min-height: 2px; transition: background .2s; }
  .cot:hover i, .cot.on i { background: var(--green); }
  .cot small { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .cot span { font-size: 10.5px; color: #3a443d; margin-bottom: 3px; white-space: nowrap; }
  .subtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .subtabs button { border: 0; background: none; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .subtabs button.on { color: var(--ink); border-color: var(--green); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .fchip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .fchip.on { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
  .fchip em { font-style: normal; opacity: .7; margin-left: 3px; }
  select.sel { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: #fff; font: inherit; }
  .orders { display: grid; gap: 12px; }
  .od { background: #fff; border: 1px solid var(--line); border-left: 5px solid #ccc; border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
  .od.moi { border-left-color: #d0563a; } .od.xac_nhan { border-left-color: #3b78c4; } .od.dang_giao { border-left-color: #e0a030; } .od.da_giao { border-left-color: #3c9a5b; } .od.huy { border-left-color: #a8a8a2; opacity: .75; }
  .od.da_lien_he { border-left-color: #3b78c4; } .od.xong { border-left-color: #3c9a5b; } .od.bo_qua { border-left-color: #a8a8a2; opacity: .75; }
  .od-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .od-h b { font-size: 16px; } .od-h small { color: var(--muted); }
  .od-h .tt { margin-left: auto; }
  .tt select { border-radius: 999px; padding: 6px 10px; font: inherit; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line); cursor: pointer; }
  .tt-moi { background: #fbe3dc; color: #b4401f; } .tt-xac_nhan, .tt-da_lien_he { background: #e1ecf8; color: #275c9c; } .tt-dang_giao { background: #fbeed9; color: #95591a; }
  .tt-cho_duyet { background: #fbe3dc; color: #b4401f; } .tt-hien { background: #e2f1df; color: #2f6b45; } .tt-an { background: #eeeeea; color: #6b6b66; }
  .tt-da_giao, .tt-xong { background: #e2f1df; color: #2f6b45; } .tt-huy, .tt-bo_qua { background: #eeeeea; color: #6b6b66; }
  .od-g { display: grid; grid-template-columns: 1.1fr 1.4fr 1fr; gap: 14px; font-size: 14px; }
  .od-g small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  .od-g a { color: var(--green); }
  .od-sp { margin: 0; padding-left: 18px; } .od-tong { font-size: 18px; font-weight: 700; }
  .od-f { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .od-f textarea { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; resize: vertical; min-height: 38px; }
  .btn.sm { padding: 7px 14px; font-size: 13.5px; }
  .btn.next { background: #2f6b45; }
  .luu-ok { font-size: 12.5px; color: var(--green); align-self: center; }
  .sum-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--muted); margin: 6px 2px 12px; }
  .sum-row b { color: var(--ink); }
  table.mail { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 14px; }
  table.mail td, table.mail th { padding: 9px 14px; border-top: 1px solid #f0ede6; text-align: left; }
  .backup { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-top: 22px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  @media (max-width: 800px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .od-g { grid-template-columns: 1fr; gap: 8px; }
    .bars .cot span { display: none; }
    .bars { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .bars .cot:nth-child(-n+6) { display: none; }   /* điện thoại: 6 tháng gần nhất */
  }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 4px; }
  .gal div { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #f1efe9; }
  .gal img { width: 100%; height: 100%; object-fit: cover; }
  .gal button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
  details.seo { border: 1px solid var(--line); border-radius: 14px; background: #fbfaf6; }
  details.seo > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; list-style: none; }
  details.seo > summary::-webkit-details-marker { display: none; }
  details.seo > summary::before { content: "▸"; color: var(--muted); transition: transform .2s; }
  details.seo[open] > summary::before { transform: rotate(90deg); }
  .seo-body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .diem { margin-left: auto; font-size: 13px; padding: 2px 10px; border-radius: 999px; font-weight: 700; }
  .d-tot { background: #e2f1df; color: #2f6b45; } .d-kha { background: #fbeed9; color: #a2621b; } .d-kem { background: #f8e0d8; color: #b4542f; }
  .dem { font-size: 12px; color: var(--muted); justify-self: end; font-weight: 400; }
  .gg { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-family: Arial, sans-serif; }
  .gg small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; font-family: system-ui, sans-serif; }
  .gg-url { font-size: 13px; color: #4d5156; } .gg-t { font-size: 19px; color: #1a0dab; line-height: 1.3; margin: 2px 0; } .gg-d { font-size: 14px; color: #4d5156; line-height: 1.5; }
  .seo-ds { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; }
  .seo-ds li { display: flex; gap: 8px; align-items: flex-start; }
  .seo-ds li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .seo-ds .tot::before { background: #3c9a5b; } .seo-ds .kha::before { background: #e0a030; } .seo-ds .kem::before { background: #d0563a; }
  .chip.d-tot, .chip.d-kha, .chip.d-kem { font-weight: 700; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    .row, .pic { grid-template-columns: 1fr; }
    .pic .pv { width: 100%; max-width: 240px; }
    .list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    main { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><b>🌿 Vườn Xanh · Quản trị</b><a href="/" target="_blank">Xem trang web ↗</a></div>
  <nav class="tabs"><a href="#san-pham" data-tab="san-pham">Sản phẩm</a><a href="#danh-muc" data-tab="danh-muc">Danh mục</a><a href="#bai-viet" data-tab="bai-viet">Bài viết tin tức</a><a href="#du-an" data-tab="du-an">Dự án</a><a href="#giao-dien" data-tab="giao-dien">Cài đặt</a><a href="#khach" data-tab="khach">Đơn hàng & khách <span id="badgeDon"></span></a></nav>
</header>
<main id="main"><div class="empty">Đang tải…</div></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  TRANG QUẢN TRỊ: sửa sản phẩm, bài viết, tải ảnh
//  Đọc dữ liệu từ /data.js + /noi-dung.js (giống trang web), lưu qua /quan-tri/api/...
// =====================================================================
const $ = (id) => document.getElementById(id);
const unesc = (s) => { const t = document.createElement("textarea"); t.innerHTML = String(s ?? ""); return t.value; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => (+n || 0).toLocaleString("vi-VN") + "₫";
const hotNow = () => (window.HOT_IDS || HOT_MAC_DINH).slice();
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); };
let tim = "";

function napScript(src) {
  return new Promise((ok) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
}

async function gui(url, data) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.loi || "Không lưu được, thử lại sau.");
  return j;
}

// Thu nhỏ ảnh ngay trên máy (tối đa 1200px) rồi tải lên
function thuNho(file) {
  return new Promise((ok, loi) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => loi(new Error("Không đọc được ảnh này."));
    img.src = url;
  });
}

// ---------------------------------------------------------------- SẢN PHẨM
const anhSP = (p) => (p.art && p.art.img ? `<img src="${p.art.img}" alt="" loading="lazy">` : "Chưa có ảnh");
function theSP(p) {
  const hot = hotNow().includes(p.id);
  return `<button class="item" data-sp="${p.id}"><span class="im">${anhSP(p)}</span><span class="tx"><b>${p.name}</b><span>${fmt(p.price)} · ${p.size || ""}</span>
    <span class="chips">${p.stock === false ? `<i class="chip out">Hết hàng</i>` : `<i class="chip">Còn hàng</i>`}${hot ? `<i class="chip hot">Bán chạy</i>` : ""}${chipSeo("sp", p, p.id)}</span></span></button>`;
}
function trangSanPham() {
  const q = tim.toLowerCase();
  const all = PRODUCTS.filter((p) => p && p.name && unesc(p.name).toLowerCase().includes(q));
  const dang = all.filter((p) => !p.an), xoa = all.filter((p) => p.an);
  return `<div class="help">Bấm vào sản phẩm để sửa ảnh, tên, giá, mô tả hoặc báo hết hàng. Bấm <b>Lưu</b> là trang web đổi ngay.</div>
    <div class="bar"><input type="search" id="tim" placeholder="Tìm sản phẩm…" value="${esc(tim)}"><button class="btn" data-moi="sp">+ Thêm sản phẩm</button></div>
    <div class="list">${dang.map(theSP).join("") || `<div class="empty">Không có sản phẩm</div>`}</div>
    ${xoa.length ? `<h2 class="sub">Đã xóa (${xoa.length}) – bấm để khôi phục</h2><div class="list deleted">${xoa.map(theSP).join("")}</div>` : ""}`;
}

let dang = null;   // dữ liệu đang sửa
function suaSanPham(id) {
  const moi = id === "moi", p = moi ? { name: "", price: "", size: "", light: "", short: "", cats: [], stock: true, art: {} } : PRODUCTS[id];
  dang = { loai: "sp", id, img: "", gal: (p.gal || []).slice() };
  const md = moi ? { kho: "", tuoi: "", thuCung: "", caoMax: "" } : CHAM_MAC_DINH(p);
  const hot = !moi && hotNow().includes(p.id);
  $("dlg").innerHTML = `<div class="dlg-head"><h3>${moi ? "Thêm sản phẩm mới" : "Sửa sản phẩm"}</h3><button class="x" data-dong aria-label="Đóng">×</button></div>
  <form class="ed" id="edForm">
    <div class="pic"><div class="pv" id="pv">${p.art && p.art.img ? `<img src="${p.art.img}" alt="">` : "Chưa có ảnh"}</div>
      <label class="f">Ảnh sản phẩm <small>Chọn ảnh từ máy hoặc điện thoại. Ảnh vuông, nền sáng nhìn đẹp nhất.</small><input type="file" id="fAnh" accept="image/*"></label></div>
    <label class="f">Tên sản phẩm *<input id="fTen" required maxlength="120" value="${esc(unesc(p.name))}"></label>
    <div class="row"><label class="f">Giá bán (đồng) *<input id="fGia" type="number" min="0" step="1000" required value="${p.price}"></label>
      <label class="f">Kích thước<input id="fSize" maxlength="80" placeholder="Ví dụ: cao 60–80cm" value="${esc(unesc(p.size))}"></label></div>
    <label class="f">Ánh sáng<input id="fLight" maxlength="80" placeholder="Ví dụ: ánh sáng tán xạ" value="${esc(unesc(p.light))}"></label>
    <label class="f">Mô tả ngắn<textarea id="fShort" rows="3" maxlength="600">${esc(unesc(p.short))}</textarea></label>
    <div class="f"><b style="font-size:14px">Danh mục * <small style="font-weight:400;color:var(--muted)">(chọn một hoặc nhiều)</small></b>
      <div class="cats">${Object.entries(CATEGORIES).filter(([k, c]) => !c.an || p.cats.includes(k)).map(([k, c]) => `<label><input type="checkbox" name="cat" value="${k}"${p.cats.includes(k) ? " checked" : ""}> ${c.name}</label>`).join("")}</div></div>

    <div class="orders">${ds.map((d) => `<div class="od ${d.trang_thai}">
      <div class="od-h"><b>${esc(d.ho_ten)}</b><small>${esc(d.thoi_gian)}</small><span class="tt">${chonTT("tu_van", d, KH.tt_tv)}</span></div>
      <div class="od-g" style="grid-template-columns:1fr 2fr"><div><small>Liên hệ</small><a href="tel:${sdtSo(d.dien_thoai)}">${esc(d.dien_thoai)}</a>${d.email ? `<br>${esc(d.email)}` : ""}</div><div><small>Nội dung</small>${esc(d.noi_dung)}</div></div>
      <div class="od-f"><textarea data-note="${d.id}" data-bang="tu_van" rows="1" placeholder="Ghi chú (đã tư vấn gì, hẹn ngày…)">${esc(d.ghi_chu_shop || "")}</textarea>
        <a class="btn ghost sm" href="tel:${sdtSo(d.dien_thoai)}">📞 Gọi</a><a class="btn ghost sm" href="https://zalo.me/${sdtSo(d.dien_thoai).replace(/^\+84/, "0")}" target="_blank" rel="noopener">Zalo</a></div>
    </div>`).join("") || `<div class="empty">Chưa có yêu cầu tư vấn</div>`}</div>`;
}
function veDanhGia() {
  const ds = KH.danh_gia;
  const ten = (id) => (PRODUCTS[id] ? unesc(PRODUCTS[id].name) : `Sản phẩm số ${id}`);
  return `<div class="help">Đánh giá khách gửi ở trang sản phẩm. Bấm <b>Duyệt</b> để hiện lên web (kèm số sao trên Google). Đánh giá xấu nhưng thật thì nên giữ và <b>phản hồi</b> lịch sự – khách tin hơn khi thấy cửa hàng xử lý.</div>
    <div class="orders">${ds.map((d) => `<div class="od ${d.trang_thai === "hien" ? "da_giao" : d.trang_thai === "an" ? "huy" : "moi"}">
      <div class="od-h"><b>${"★".repeat(+d.sao)}${"☆".repeat(5 - d.sao)}</b><b style="font-size:15px">${esc(d.ten)}</b><small>${esc(d.thoi_gian)} · <a href="/san-pham-${d.sp_id}/" target="_blank">${esc(ten(d.sp_id))}</a></small><span class="tt">${chonTT("danh_gia", d, KH.tt_dg)}</span></div>
      <div style="font-size:15px;line-height:1.6">${esc(d.noi_dung)}</div>
      ${d.anh ? `<a href="${d.anh}" target="_blank"><img src="${d.anh}" alt="" style="width:120px;height:120px;object-fit:cover;border-radius:10px"></a>` : ""}
      <div class="od-f"><textarea data-ph="${d.id}" rows="1" placeholder="Phản hồi của cửa hàng (hiện dưới đánh giá trên web)…">${esc(d.phan_hoi || "")}</textarea>
        ${d.trang_thai !== "hien" ? `<button class="btn sm next" data-dg-tt="${d.id}" data-v="hien">Duyệt – hiện lên web</button>` : `<button class="btn ghost sm" data-dg-tt="${d.id}" data-v="an">Ẩn</button>`}
        <button class="btn red sm" data-dg-xoa="${d.id}">Xóa</button></div>
    </div>`).join("") || `<div class="empty">Chưa có đánh giá nào. Gợi ý: nhắn khách đã mua xin đánh giá kèm ảnh cây.</div>`}</div>`;
}
function veEmail() {
  return `<div class="bar" style="justify-content:flex-end"><button class="btn ghost sm" data-copy="${esc(KH.dang_ky.map((d) => d.email).join(", "))}">Sao chép tất cả email</button><a class="btn ghost sm" href="/quan-tri/tai/dang_ky.csv">Tải Excel</a></div>
    <table class="mail"><thead><tr><th>Email</th><th>Ngày đăng ký</th></tr></thead><tbody>${KH.dang_ky.map((d) => `<tr><td>${esc(d.email)}</td><td>${esc(d.thoi_gian)}</td></tr>`).join("") || `<tr><td colspan="2" class="empty">Chưa có ai đăng ký</td></tr>`}</tbody></table>`;
}
async function doiTrangThai(bang, id, tt) {
  try {
    await gui("/quan-tri/api/sua-don", { loai: bang, id, trang_thai: tt });
    const ds = bang === "tu_van" ? KH.tu_van : bang === "danh_gia" ? KH.danh_gia : KH.don_hang, d = ds.find((x) => x.id === id);
    const now = new Date(), s = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    if (bang === "don_hang") d.ngay_giao = tt === "da_giao" ? (d.trang_thai === "da_giao" ? d.ngay_giao : s) : "";
    d.trang_thai = tt;
    toast(`Đã chuyển sang “${(bang === "tu_van" ? KH.tt_tv : bang === "danh_gia" ? KH.tt_dg : KH.tt_don)[tt]}”`);
    $("badgeDon").textContent = soViecMoi() || "";
    trangKhach();
  } catch (e) { toast(e.message); trangKhach(); }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-loc-tt],[data-muc],[data-tiep],[data-copy],[data-dg-tt],[data-dg-xoa]");
  if (!t || !KH) return;
  if (t.dataset.muc) { LOC.muc = t.dataset.muc; LOC.q = ""; return trangKhach(); }
  if (t.dataset.locTt) { LOC.muc = "don"; LOC.tt = t.dataset.locTt; LOC.thang = t.dataset.locThang || (t.classList.contains("fchip") ? LOC.thang : ""); trangKhach(); if (t.classList.contains("stat") || t.classList.contains("cot")) document.querySelector(".subtabs").scrollIntoView({ behavior: "smooth" }); return; }
  if (t.dataset.tiep) return doiTrangThai("don_hang", +t.dataset.tiep, t.dataset.ttMoi);
  if (t.dataset.dgTt) return doiTrangThai("danh_gia", +t.dataset.dgTt, t.dataset.v);
  if (t.dataset.dgXoa) {
    if (!confirm("Xóa hẳn đánh giá này?")) return;
    const id = +t.dataset.dgXoa;
    return gui("/quan-tri/api/sua-don", { loai: "danh_gia", id, xoa: true }).then(() => { KH.danh_gia = KH.danh_gia.filter((x) => x.id !== id); toast("Đã xóa"); $("badgeDon").textContent = soViecMoi() || ""; trangKhach(); }, (err) => toast(err.message));
  }
  if (t.dataset.copy !== undefined) { navigator.clipboard.writeText(t.dataset.copy).then(() => toast("Đã sao chép"), () => toast("Không sao chép được")); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.tt) return doiTrangThai(t.dataset.bang, +t.dataset.tt, t.value);
  if (t.id === "locThang") { LOC.thang = t.value; return trangKhach(); }
  if (t.dataset && t.dataset.ph) {
    const id = +t.dataset.ph;
    gui("/quan-tri/api/sua-don", { loai: "danh_gia", id, phan_hoi: t.value }).then(() => { KH.danh_gia.find((x) => x.id === id).phan_hoi = t.value; toast("Đã lưu phản hồi"); }, (err) => toast(err.message));
    return;
  }
  if (t.dataset && t.dataset.note) {
    const bang = t.dataset.bang, id = +t.dataset.note;
    gui("/quan-tri/api/sua-don", { loai: bang, id, ghi_chu_shop: t.value }).then(() => {
      (bang === "tu_van" ? KH.tu_van : KH.don_hang).find((x) => x.id === id).ghi_chu_shop = t.value; toast("Đã lưu ghi chú");
    }, (err) => toast(err.message));
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "timDon") { LOC.q = e.target.value; const pos = e.target.selectionStart; trangKhach(); const i = $("timDon"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }
});

// ---------------------------------------------------------------- GIAO DIỆN
const TB_MAC_DINH = "🚚 Giao nhanh trong ngày nội thành · Miễn phí đơn từ 500.000₫";
function trangGiaoDien() {
  const c = window.CAI_DAT || {};
  return `<div class="help">Thay đổi ở đây áp dụng ngay cho toàn bộ trang web sau khi bấm <b>Lưu</b>.</div>
  <form class="ed" id="gdForm" style="background:#fff;border:1px solid var(--line);border-radius:16px;max-width:760px">
    <label class="f">Dòng thông báo đầu trang <small>Dải chữ nhỏ trên cùng của web – dùng cho khuyến mãi, phí giao hàng, lịch nghỉ lễ… Để trống = dùng câu mặc định.</small>
      <input id="gdTB" maxlength="160" placeholder="${esc(TB_MAC_DINH)}" value="${esc(unesc(c.thong_bao || ""))}"></label>
    <div class="gdxem" id="gdXem" style="border-radius:10px;padding:8px 14px;font-size:13px;text-align:center"></div>
    <div class="checks" style="flex-direction:column;gap:6px"><label style="font-weight:600"><input type="checkbox" id="gdTet"${c.tet ? " checked" : ""}> Bật giao diện Tết 🧧</label>
      <small style="color:var(--muted);margin-left:26px">Điểm nhấn đỏ son – vàng đồng, hoa mai/bao lì xì ở banner, nhãn “Bán chạy” màu đỏ. Nên bật từ khoảng giữa tháng 12 âm lịch đến hết rằm tháng Giêng, rồi tắt để về giao diện xanh thường ngày.</small></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
    <label class="f">Giờ chốt đơn giao trong ngày <small>Trang sản phẩm hiện “Đặt trong 2 giờ 15 phút nữa để nhận cây hôm nay”. Sau giờ này sẽ hiện “giao sáng mai”.</small>
      <select id="gdGio" style="max-width:160px">${Array.from({ length: 13 }, (_, k) => k + 8).map((h) => `<option value="${h}"${(c.gio_chot || 15) === h ? " selected" : ""}>${h}h</option>`).join("")}</select></label>
    <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
    <div class="f"><b style="font-size:14px">Mã QR chuyển khoản <small style="font-weight:400;color:var(--muted)">– khách chọn “Chuyển khoản” sẽ thấy mã QR đã điền sẵn số tiền và mã đơn ngay sau khi đặt. Để trống = tắt.</small></b></div>
    <div class="row"><label class="f">Ngân hàng<select id="gdBank"><option value="">— Chưa dùng —</option>${Object.entries(NGAN_HANG).map(([k, v]) => `<option value="${k}"${c.bank === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="f">Số tài khoản<input id="gdStk" inputmode="numeric" maxlength="20" value="${esc(c.stk || "")}"></label></div>
    <label class="f">Tên chủ tài khoản <small>Viết hoa không dấu, đúng như trên app ngân hàng</small><input id="gdChu" maxlength="60" placeholder="NGUYEN VAN A" value="${esc(unesc(c.chu_tk || ""))}"></label>
    <div id="gdQR" style="display:flex;gap:14px;align-items:center"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
    <label class="f">Mã Google Analytics (GA4) <small>Dạng G-XXXXXXXXXX – lấy ở analytics.google.com → Quản trị → Luồng dữ liệu. Dùng để biết có bao nhiêu khách vào web, xem cây nào, thêm giỏ, đặt hàng.</small>
      <input id="gdGA" maxlength="20" placeholder="G-XXXXXXXXXX" value="${esc(c.ga || "")}" style="max-width:260px"></label>
    <p class="msg" id="edMsg"></p>
    <div class="actions"><span></span><div><a class="btn ghost" href="/" target="_blank">Xem trang web ↗</a><button class="btn" type="submit" id="edLuu">Lưu</button></div></div>
  </form>`;
}
function xemGD() {
  if (!$("gdXem")) return;
  const tet = $("gdTet").checked;
  $("gdXem").textContent = $("gdTB").value.trim() || TB_MAC_DINH;
  $("gdXem").style.background = tet ? "linear-gradient(90deg,#8e1a14,#b3261e 50%,#8e1a14)" : "#234f34";
  $("gdXem").style.color = tet ? "#ffe9b8" : "#e3efe0";
  const b = $("gdBank").value, stk = $("gdStk").value.replace(/\D/g, ""), ten = $("gdChu").value.trim();
  $("gdQR").innerHTML = b && stk.length >= 6 ? `<img src="https://img.vietqr.io/image/${b}-${stk}-compact2.png?amount=100000&addInfo=VXTHU&accountName=${encodeURIComponent(ten)}" alt="" width="120" style="border-radius:8px;border:1px solid var(--line)">
    <small style="color:var(--muted)">Mã thử 100.000₫ – quét bằng app ngân hàng để kiểm tra đúng tên chủ tài khoản (không cần chuyển).</small>` : "";
}
document.addEventListener("input", (e) => { if (e.target.closest && e.target.closest("#gdForm")) xemGD(); });
document.addEventListener("change", (e) => { if (e.target.closest && e.target.closest("#gdForm")) xemGD(); });
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "gdForm") return;
  e.preventDefault();
  const stk = $("gdStk").value.replace(/\D/g, "");
  if ($("gdBank").value && stk.length < 6) { $("edMsg").textContent = "Số tài khoản chưa đúng."; return; }
  const gaId = $("gdGA").value.trim().toUpperCase();
  if (gaId && !/^G-[A-Z0-9]{4,15}$/.test(gaId)) { $("edMsg").textContent = "Mã Google Analytics cần dạng G-XXXXXXXXXX."; return; }
  try { await gui("/quan-tri/api/cai-dat", { tet: $("gdTet").checked, thong_bao: $("gdTB").value, gio_chot: +$("gdGio").value, bank: $("gdBank").value, stk, chu_tk: $("gdChu").value, ga: gaId }); xong("Đã lưu cài đặt"); }
  catch (err) { $("edMsg").textContent = err.message; }
});

// ---------------------------------------------------------------- KHUNG CHUNG
function ve() {
  const tab = (location.hash.slice(1) || "san-pham");
  document.querySelectorAll("[data-tab]").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  if (tab === "khach") { KH = null; return trangKhach(); }   // luôn tải dữ liệu mới khi mở tab
  if (tab === "giao-dien") { $("main").innerHTML = trangGiaoDien(); xemGD(); return; }
  $("main").innerHTML = tab === "bai-viet" ? trangBaiViet() : tab === "danh-muc" ? trangDanhMuc() : tab === "du-an" ? trangDuAn() : trangSanPham();
}
addEventListener("hashchange", () => { tim = ""; if ($("dlg").open) $("dlg").close(); ve(); });

document.addEventListener("input", (e) => {
  if (e.target.closest && e.target.closest("#edForm")) capNhatSeo();
  if (e.target.id === "tim") { tim = e.target.value; const pos = e.target.selectionStart; ve(); const t = $("tim"); t.focus(); t.setSelectionRange(pos, pos); }
});
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-sp],[data-bv],[data-dm],[data-da],[data-bogal],[data-moi],[data-dong],[data-xoa]");
  if (!t) return;
  if (t.dataset.sp !== undefined) return suaSanPham(+t.dataset.sp);
  if (t.dataset.bv !== undefined) return suaBaiViet(+t.dataset.bv);
  if (t.dataset.dm !== undefined) return suaDanhMuc(t.dataset.dm);
  if (t.dataset.da !== undefined) return suaDuAn(+t.dataset.da);
  if (t.dataset.bogal !== undefined) { dang.gal.splice(+t.dataset.bogal, 1); return veGal(); }
  if (t.dataset.moi) return t.dataset.moi === "sp" ? suaSanPham("moi") : t.dataset.moi === "dm" ? suaDanhMuc("moi") : t.dataset.moi === "da" ? suaDuAn("moi") : suaBaiViet("moi");
  if (t.dataset.dong !== undefined) return $("dlg").close();
  if (t.dataset.xoa !== undefined) {
    const sp = dang.loai === "sp", dm = dang.loai === "dm", da = dang.loai === "da";
    const hoi = sp ? "Xóa sản phẩm này khỏi trang web?" : da ? "Xóa dự án này khỏi trang web?" : dm ? "Xóa danh mục này khỏi menu? Các sản phẩm bên trong vẫn còn ở danh mục khác." : "Xóa bài viết này khỏi trang web?";
    if (!confirm(hoi + " (Có thể khôi phục lại sau)")) return;
    try {
      if (dm) await gui("/quan-tri/api/danh-muc", { slug: dang.id, xoa: true, name: CATEGORIES[dang.id].name, intro: CATEGORIES[dang.id].intro, nhom: nhomCua(dang.id) });
      else await gui(sp ? "/quan-tri/api/san-pham" : da ? "/quan-tri/api/du-an" : "/quan-tri/api/bai-viet", { id: dang.id, xoa: true });
      xong("Đã xóa");
    }
    catch (err) { $("edMsg").textContent = err.message; }
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.closest && e.target.closest("#edForm")) setTimeout(capNhatSeo, 0);
  if (e.target.id === "fGal" && e.target.files.length) {
    const nut = $("edLuu"), files = [...e.target.files]; nut.disabled = true; $("edMsg").textContent = "";
    for (let k = 0; k < files.length; k++) {
      $("edMsg").textContent = `Đang tải ảnh ${k + 1}/${files.length}…`;
      try { const j = await gui("/quan-tri/api/anh", { data: await thuNho(files[k]) }); dang.gal.push(j.url); veGal(); }
      catch (err) { $("edMsg").textContent = `Ảnh ${files[k].name}: ${err.message}`; }
    }
    if (/^Đang tải/.test($("edMsg").textContent)) $("edMsg").textContent = "";
    e.target.value = ""; nut.disabled = false; return;
  }
  if (e.target.id !== "fAnh" || !e.target.files[0]) return;
  const nut = $("edLuu"); nut.disabled = true; $("edMsg").textContent = ""; $("pv").textContent = "Đang tải ảnh…";
  try {
    const data = await thuNho(e.target.files[0]);
    const j = await gui("/quan-tri/api/anh", { data });
    dang.img = j.url; $("pv").innerHTML = `<img src="${j.url}" alt="">`;
  } catch (err) { $("pv").textContent = "Lỗi ảnh"; $("edMsg").textContent = err.message; }
  nut.disabled = false;
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "edForm") return;
  e.preventDefault();
  const nut = $("edLuu"); $("edMsg").textContent = "";
  try {
    const L = dang.loai;
    const d = L === "sp" ? goiSanPham() : L === "dm" ? goiDanhMuc() : L === "da" ? goiDuAn() : goiBaiViet();
    nut.disabled = true; nut.textContent = "Đang lưu…";
    await gui({ sp: "/quan-tri/api/san-pham", dm: "/quan-tri/api/danh-muc", da: "/quan-tri/api/du-an", bv: "/quan-tri/api/bai-viet" }[L], d);
    xong("Đã lưu – trang web đã cập nhật");
  } catch (err) { $("edMsg").textContent = err.message; nut.disabled = false; nut.textContent = "Lưu"; }
});
function xong(tb) { sessionStorage.setItem("vx-toast", tb); location.reload(); }

(async () => {
  const t = Date.now();
  await napScript("/data.js?t=" + t);
  await napScript("/noi-dung.js?t=" + t);
  if (typeof PRODUCTS === "undefined") { $("main").innerHTML = `<div class="empty">Không tải được dữ liệu trang web.</div>`; return; }
  ve(); xemGD();
  if (!KH) taiKhach().catch(() => {});
  const tb = sessionStorage.getItem("vx-toast"); if (tb) { sessionStorage.removeItem("vx-toast"); toast(tb); }
})();
</script>
</body>
</html>
