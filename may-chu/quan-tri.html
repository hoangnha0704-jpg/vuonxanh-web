<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị – Vườn Xanh</title>
<style>
  :root { --green: #2f6b45; --green-dark: #1f3d2b; --soft: #e8f0e6; --line: #e4e0d4; --bg: #f7f5ef; --muted: #6b766e; --ink: #1f2a22; --red: #b4542f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select, textarea { font: inherit; }
  header { background: var(--green-dark); color: #fff; }
  .top { max-width: 1200px; margin: auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top b { font-size: 17px; }
  .top a { color: #cfe5c4; text-decoration: none; font-size: 14px; }
  nav.tabs { max-width: 1200px; margin: auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs a { color: #cfe5c4; text-decoration: none; padding: 10px 16px; border-radius: 10px 10px 0 0; white-space: nowrap; font-weight: 500; }
  nav.tabs a.on { background: var(--bg); color: var(--ink); }
  main { max-width: 1200px; margin: auto; padding: 20px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .bar input[type=search] { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--green); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.red { background: #fff; color: var(--red); border: 1px solid #ecc9bb; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .help { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: #3a443d; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; }
  .item:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-1px); }
  .item .im { aspect-ratio: 1; background: #f1efe9; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .item.post .im { aspect-ratio: 16/10; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .tx { padding: 10px 12px 12px; display: grid; gap: 2px; }
  .item .tx b { font-size: 14.5px; font-weight: 600; }
  .item .tx span { font-size: 13px; color: var(--muted); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--green); font-weight: 600; }
  .chip.out { background: #f6e3da; color: var(--red); }
  .chip.hot { background: #fbe9dc; color: #b4542f; }
  h2.sub { font-size: 16px; margin: 28px 0 10px; color: var(--muted); }
  .deleted .item { opacity: .6; }
  /* hộp sửa */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(760px, 96vw); max-height: 94vh; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(20,30,24,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  .dlg-head h3 { margin: 0; font-size: 18px; }
  .x { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); }
  form.ed { padding: 18px 20px 20px; display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label.f { display: grid; gap: 5px; font-size: 14px; font-weight: 600; }
  label.f small { font-weight: 400; color: var(--muted); }
  .f input, .f textarea, .f select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; font-weight: 400; }
  .f textarea { resize: vertical; }
  .pic { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
  .pic .pv { width: 150px; aspect-ratio: 1; border-radius: 12px; background: #f1efe9; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; }
  .pic .pv img { width: 100%; height: 100%; object-fit: cover; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; font-weight: 400; font-size: 14px; }
  .cats label, .checks label { display: flex; gap: 8px; align-items: center; }
  .checks { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
  .actions div { display: flex; gap: 10px; flex-wrap: wrap; }
  .msg { font-size: 14px; color: var(--red); min-height: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--green-dark); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  iframe.khach { width: 100%; height: calc(100vh - 150px); border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 4px; }
  .gal div { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #f1efe9; }
  .gal img { width: 100%; height: 100%; object-fit: cover; }
  .gal button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    .row, .pic { grid-template-columns: 1fr; }
    .pic .pv { width: 100%; max-width: 240px; }
    .list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    main { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><b>🌿 Vườn Xanh · Quản trị</b><a href="/" target="_blank">Xem trang web ↗</a></div>
  <nav class="tabs"><a href="#san-pham" data-tab="san-pham">Sản phẩm</a><a href="#danh-muc" data-tab="danh-muc">Danh mục</a><a href="#bai-viet" data-tab="bai-viet">Bài viết tin tức</a><a href="#du-an" data-tab="du-an">Dự án</a><a href="#khach" data-tab="khach">Đơn hàng & khách</a></nav>
</header>
<main id="main"><div class="empty">Đang tải…</div></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  TRANG QUẢN TRỊ: sửa sản phẩm, bài viết, tải ảnh
//  Đọc dữ liệu từ /data.js + /noi-dung.js (giống trang web), lưu qua /quan-tri/api/...
// =====================================================================
const $ = (id) => document.getElementById(id);
const unesc = (s) => { const t = document.createElement("textarea"); t.innerHTML = String(s ?? ""); return t.value; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => (+n || 0).toLocaleString("vi-VN") + "₫";
const hotNow = () => (window.HOT_IDS || HOT_MAC_DINH).slice();
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); };
let tim = "";

function napScript(src) {
  return new Promise((ok) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
}

async function gui(url, data) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.loi || "Không lưu được, thử lại sau.");
  return j;
}

// Thu nhỏ ảnh ngay trên máy (tối đa 1200px) rồi tải lên
function thuNho(file) {
  return new Promise((ok, loi) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => loi(new Error("Không đọc được ảnh này."));
    img.src = url;
  });
}

// ---------------------------------------------------------------- SẢN PHẨM
const anhSP = (p) => (p.art && p.art.img ? `<img src="${p.art.img}" alt="" loading="lazy">` : "Chưa có ảnh");
function theSP(p) {
  const hot = hotNow().includes(p.id);
  return `<button class="item" data-sp="${p.id}"><span class="im">${anhSP(p)}</span><span class="tx"><b>${p.name}</b><span>${fmt(p.price)} · ${p.size || ""}</span>
    <span class="chips">${p.stock === false ? `<i class="chip out">Hết hàng</i>` : `<i class="chip">Còn hàng</i>`}${hot ? `<i class="chip hot">Bán chạy</i>` : ""}</span></span></button>`;
}
function trangSanPham() {
  const q = tim.toLowerCase();
  const all = PRODUCTS.filter((p) => p && p.name && unesc(p.name).toLowerCase().includes(q));
  const dang = all.filter((p) => !p.an), xoa = all.filter((p) => p.an);
  return `<div class="help">Bấm vào sản phẩm để sửa ảnh, tên, giá, mô tả hoặc báo hết hàng. Bấm <b>Lưu</b> là trang web đổi ngay.</div>
    <div class="bar"><input type="search" id="tim" placeholder="Tìm sản phẩm…" value="${esc(tim)}"><button class="btn" data-moi="sp">+ Thêm sản phẩm</button></div>
    <div class="list">${dang.map(theSP).join("") || `<div class="empty">Không có sản phẩm</div>`}</div>
    ${xoa.length ? `<h2 class="sub">Đã xóa (${xoa.length}) – bấm để khôi phục</h2><div class="list deleted">${xoa.map(theSP).join("")}</div>` : ""}`;
}

let dang = null;   // dữ liệu đang sửa
function suaSanPham(id) {
  const moi = id === "moi", p = moi ? { name: "", price: "", size: "", light: "", short: "", cats: [], stock: true, art: {} } : PRODUCTS[id];
  dang = { loai: "sp", id, img: "" };
  const hot = !moi && hotNow().includes(p.id);
  $("dlg").innerHTML = `<div class="dlg-head"><h3>${moi ? "Thêm sản phẩm mới" : "Sửa sản phẩm"}</h3><button class="x" data-dong aria-label="Đóng">×</button></div>
  <form class="ed" id="edForm">
    <div class="pic"><div class="pv" id="pv">${p.art && p.art.img ? `<img src="${p.art.img}" alt="">` : "Chưa có ảnh"}</div>
      <label class="f">Ảnh sản phẩm <small>Chọn ảnh từ máy hoặc điện thoại. Ảnh vuông, nền sáng nhìn đẹp nhất.</small><input type="file" id="fAnh" accept="image/*"></label></div>
    <label class="f">Tên sản phẩm *<input id="fTen" required maxlength="120" value="${esc(unesc(p.name))}"></label>
    <div class="row"><label class="f">Giá bán (đồng) *<input id="fGia" type="number" min="0" step="1000" required value="${p.price}"></label>
      <label class="f">Kích thước<input id="fSize" maxlength="80" placeholder="Ví dụ: cao 60–80cm" value="${esc(unesc(p.size))}"></label></div>
    <label class="f">Ánh sáng<input id="fLight" maxlength="80" placeholder="Ví dụ: ánh sáng tán xạ" value="${esc(unesc(p.light))}"></label>
    <label class="f">Mô tả ngắn<textarea id="fShort" rows="3" maxlength="600">${esc(unesc(p.short))}</textarea></label>
    <div class="f"><b style="font-size:14px">Danh mục * <small style="font-weight:400;color:var(--muted)">(chọn một hoặc nhiều)</small></b>
      <div class="cats">${Object.entries(CATEGORIES).filter(([k, c]) => !c.an || p.cats.includes(k)).map(([k, c]) => `<label><input type="checkbox" name="cat" value="${k}"${p.cats.includes(k) ? " checked" : ""}> ${c.name}</label>`).join("")}</div></div>
    <div class="checks"><label><input type="checkbox" id="fStock"${p.stock !== false ? " checked" : ""}> Còn hàng</label><label><input type="checkbox" id="fHot"${hot ? " checked" : ""}> Hiện trong "Cây bán chạy"</label></div>
    <p class="msg" id="edMsg"></p>
    <div class="actions"><div>${moi ? "" : p.an ? `<span style="color:var(--muted);font-size:14px">Sản phẩm này đang bị ẩn. Bấm Lưu để hiện lại.</span>` : `<button type="button" class="btn red" data-xoa>Xóa sản phẩm</button>`}</div>
      <div>${moi || p.an ? "" : `<a class="btn ghost" href="/san-pham-${p.id}/" target="_blank">Xem trên web ↗</a>`}<button class="btn" type="submit" id="edLuu">${p.an ? "Lưu và hiện lại" : "Lưu"}</button></div></div>
  </form>`;
  $("dlg").showModal();
}
function goiSanPham() {
  const cats = [...document.querySelectorAll("input[name=cat]:checked")].map((x) => x.value);
  let hot = hotNow(); const id = dang.id;
  const on = $("fHot").checked;
  if (id !== "moi") { if (on && !hot.includes(+id)) hot.push(+id); if (!on) hot = hot.filter((x) => x !== +id); }
  const d = { id, base_len: PRODUCTS.length, name: $("fTen").value, price: $("fGia").value, size: $("fSize").value, light: $("fLight").value,
    short: $("fShort").value, cats, stock: $("fStock").checked, img: dang.img || (id !== "moi" && PRODUCTS[id].art.img) || "", hot_ids: hot, hot: on };
  if (!d.name.trim()) throw new Error("Chưa nhập tên sản phẩm.");
  if (d.price === "") throw new Error("Chưa nhập giá.");
  if (!cats.length) throw new Error("Chọn ít nhất một danh mục.");
  return d;
}

// ---------------------------------------------------------------- BÀI VIẾT
const ngay = (d) => { const [a, b, c] = String(d || "").split("/").map(Number); return new Date(c || 0, (b || 1) - 1, a || 1).getTime(); };
const homNay = () => { const t = new Date(); return `${String(t.getDate()).padStart(2, "0")}/${String(t.getMonth() + 1).padStart(2, "0")}/${t.getFullYear()}`; };
const veChu = (h) => unesc(String(h || "").replace(/<\/p><p>/g, "\n\n").replace(/<br>/g, "\n").replace(/<[^>]+>/g, ""));
const sangChu = (s) => (s || []).map(([h, t]) => `## ${veChu(h)}\n${veChu(t)}`).join("\n\n");
function tachMuc(text) {
  const muc = []; let cur = null;
  for (const line of text.replace(/\r/g, "").split("\n")) {
    const m = line.match(/^\s*##\s*(.*)$/);
    if (m) { cur = [m[1].trim() || "Chi tiết", []]; muc.push(cur); continue; }
    if (!cur) { if (!line.trim()) continue; cur = ["Chi tiết", []]; muc.push(cur); }
    cur[1].push(line);
  }
  return muc.map(([h, l]) => [h, l.join("\n").trim()]).filter(([h, t]) => h || t);
}
function theBV(x, i) {
  return `<button class="item post" data-bv="${i}"><span class="im">${x.art && x.art.img ? `<img src="${x.art.img}" alt="" loading="lazy">` : "Chưa có ảnh"}</span>
    <span class="tx"><b>${x.t}</b><span>${x.d}</span></span></button>`;
}
function trangBaiViet() {
  const q = tim.toLowerCase();
  const all = POSTS.map((x, i) => [x, i]).filter(([x]) => x && x.t && unesc(x.t).toLowerCase().includes(q)).sort((a, b) => ngay(b[0].d) - ngay(a[0].d));
  const dang = all.filter(([x]) => !x.an), xoa = all.filter(([x]) => x.an);
  return `<div class="help">Bài viết hiện ở mục <b>Tin tức</b> và <b>Mẹo chăm cây</b> trên trang chủ, bài mới nhất lên đầu.</div>
    <div class="bar"><input type="search" id="tim" placeholder="Tìm bài viết…" value="${esc(tim)}"><button class="btn" data-moi="bv">+ Viết bài mới</button></div>
    <div class="list">${dang.map(([x, i]) => theBV(x, i)).join("") || `<div class="empty">Chưa có bài viết</div>`}</div>
    ${xoa.length ? `<h2 class="sub">Đã xóa (${xoa.length}) – bấm để khôi phục</h2><div class="list deleted">${xoa.map(([x, i]) => theBV(x, i)).join("")}</div>` : ""}`;
}
function suaBaiViet(id) {
  const moi = id === "moi", x = moi ? { t: "", d: homNay(), p: "", s: [], art: {} } : POSTS[id];
  dang = { loai: "bv", id, img: "" };
  $("dlg").innerHTML = `<div class="dlg-head"><h3>${moi ? "Viết bài mới" : "Sửa bài viết"}</h3><button class="x" data-dong aria-label="Đóng">×</button></div>
  <form class="ed" id="edForm">
    <div class="pic"><div class="pv" id="pv">${x.art && x.art.img ? `<img src="${x.art.img}" alt="">` : "Chưa có ảnh"}</div>
      <label class="f">Ảnh đại diện bài viết<input type="file" id="fAnh" accept="image/*"></label></div>
    <label class="f">Tiêu đề *<input id="fT" required maxlength="200" value="${esc(unesc(x.t))}"></label>
    <div class="row"><label class="f">Ngày đăng <small>ngày/tháng/năm</small><input id="fD" maxlength="10" placeholder="${homNay()}" value="${esc(x.d)}"></label><span></span></div>
    <label class="f">Đoạn mở đầu <small>1–2 câu tóm tắt, hiện ở danh sách bài viết</small><textarea id="fP" rows="3" maxlength="600">${esc(veChu(x.p))}</textarea></label>
    <label class="f">Nội dung bài <small>Mỗi mục bắt đầu bằng một dòng <b>## Tiêu đề mục</b>. Để trống một dòng để sang đoạn mới.</small>
      <textarea id="fS" rows="14" placeholder="## Vì sao nên trồng cây này?&#10;Viết nội dung ở đây…&#10;&#10;## Cách chăm sóc&#10;Viết nội dung ở đây…">${esc(sangChu(x.s))}</textarea></label>
    <p class="msg" id="edMsg"></p>
    <div class="actions"><div>${moi || x.an ? "" : `<button type="button" class="btn red" data-xoa>Xóa bài viết</button>`}</div>
      <div>${moi || x.an ? "" : `<a class="btn ghost" href="/bai-viet-${id}/" target="_blank">Xem trên web ↗</a>`}<button class="btn" type="submit" id="edLuu">${x.an ? "Lưu và hiện lại" : "Lưu"}</button></div></div>
  </form>`;
  $("dlg").showModal();
}
function goiBaiViet() {
  const id = dang.id;
  const d = { id, base_len: POSTS.length, t: $("fT").value, d: $("fD").value.trim() || homNay(), p: $("fP").value, s: tachMuc($("fS").value),
    img: dang.img || (id !== "moi" && POSTS[id].art && POSTS[id].art.img) || "" };
  if (!d.t.trim()) throw new Error("Chưa nhập tiêu đề.");
  if (!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d.d)) throw new Error("Ngày đăng cần dạng ngày/tháng/năm, ví dụ " + homNay());
  if (!d.s.length) throw new Error("Chưa có nội dung bài viết.");
  return d;
}

// ---------------------------------------------------------------- DỰ ÁN
function theDA(x, i) {
  return `<button class="item post" data-da="${i}"><span class="im">${x.art && x.art.img ? `<img src="${x.art.img}" alt="" loading="lazy">` : "Chưa có ảnh"}</span>
    <span class="tx"><b>${x.t}</b><span>${x.loc || ""}${(x.gal || []).length ? ` · ${x.gal.length} ảnh công trình` : ""}</span></span></button>`;
}
function trangDuAn() {
  const q = tim.toLowerCase();
  const all = PROJECTS.map((x, i) => [x, i]).filter(([x]) => x && x.t && unesc(x.t).toLowerCase().includes(q)).sort((a, b) => (b[0].them || 0) - (a[0].them || 0) || a[1] - b[1]);
  const hien = all.filter(([x]) => !x.an), xoa = all.filter(([x]) => x.an);
  return `<div class="help">Chia sẻ công trình đã làm: ảnh đại diện, mô tả và nhiều ảnh thực tế. Dự án hiện ở mục <b>Dự án</b> trên web, dự án mới nhất lên đầu.</div>
    <div class="bar"><input type="search" id="tim" placeholder="Tìm dự án…" value="${esc(tim)}"><button class="btn" data-moi="da">+ Thêm dự án</button></div>
    <div class="list">${hien.map(([x, i]) => theDA(x, i)).join("") || `<div class="empty">Chưa có dự án</div>`}</div>
    ${xoa.length ? `<h2 class="sub">Đã xóa (${xoa.length}) – bấm để khôi phục</h2><div class="list deleted">${xoa.map(([x, i]) => theDA(x, i)).join("")}</div>` : ""}`;
}
const veGal = () => { $("gal").innerHTML = dang.gal.map((u, k) => `<div><img src="${u}" alt=""><button type="button" data-bogal="${k}" aria-label="Bỏ ảnh">×</button></div>`).join("") || `<span style="color:var(--muted);font-size:13px">Chưa có ảnh công trình</span>`; };
function suaDuAn(id) {
  const moi = id === "moi", x = moi ? { t: "", p: "", loc: "", plants: "", s: [], gal: [], art: {} } : PROJECTS[id];
  dang = { loai: "da", id, img: "", gal: (x.gal || []).slice() };
  $("dlg").innerHTML = `<div class="dlg-head"><h3>${moi ? "Thêm dự án mới" : "Sửa dự án"}</h3><button class="x" data-dong aria-label="Đóng">×</button></div>
  <form class="ed" id="edForm">
    <div class="pic"><div class="pv" id="pv">${x.art && x.art.img ? `<img src="${x.art.img}" alt="">` : "Chưa có ảnh"}</div>
      <label class="f">Ảnh đại diện dự án<input type="file" id="fAnh" accept="image/*"></label></div>
    <label class="f">Tên dự án *<input id="fT" required maxlength="200" placeholder="Ví dụ: Sân vườn biệt thự anh Nam – Thái Bình" value="${esc(unesc(x.t))}"></label>
    <div class="row"><label class="f">Địa điểm<input id="fLoc" maxlength="120" placeholder="Ví dụ: TP Thái Bình" value="${esc(unesc(x.loc))}"></label>
      <label class="f">Cây sử dụng<input id="fPl" maxlength="300" placeholder="Ví dụ: Bàng Singapore, kim tiền" value="${esc(unesc(x.plants))}"></label></div>
    <label class="f">Giới thiệu ngắn<textarea id="fP" rows="3" maxlength="600">${esc(veChu(x.p))}</textarea></label>
    <label class="f">Nội dung <small>Mỗi mục bắt đầu bằng dòng <b>## Tiêu đề mục</b>, ví dụ ## Yêu cầu, ## Giải pháp, ## Kết quả. Để trống thì web dùng nội dung mặc định.</small>
      <textarea id="fS" rows="9" placeholder="## Yêu cầu của khách&#10;…&#10;&#10;## Giải pháp&#10;…&#10;&#10;## Kết quả&#10;…">${esc(sangChu(x.s))}</textarea></label>
    <div class="f"><b style="font-size:14px">Ảnh công trình <small style="font-weight:400;color:var(--muted)">(chọn được nhiều ảnh một lúc)</small></b>
      <input type="file" id="fGal" accept="image/*" multiple><div class="gal" id="gal"></div></div>
    <p class="msg" id="edMsg"></p>
    <div class="actions"><div>${moi || x.an ? "" : `<button type="button" class="btn red" data-xoa>Xóa dự án</button>`}</div>
      <div>${moi || x.an ? "" : `<a class="btn ghost" href="/du-an-${id}/" target="_blank">Xem trên web ↗</a>`}<button class="btn" type="submit" id="edLuu">${x.an ? "Lưu và hiện lại" : "Lưu"}</button></div></div>
  </form>`;
  veGal();
  $("dlg").showModal();
}
function goiDuAn() {
  const id = dang.id;
  const d = { id, base_len: PROJECTS.length, t: $("fT").value, loc: $("fLoc").value, plants: $("fPl").value, p: $("fP").value, s: tachMuc($("fS").value),
    gal: dang.gal, img: dang.img || (id !== "moi" && PROJECTS[id].art && PROJECTS[id].art.img) || dang.gal[0] || "" };
  if (!d.t.trim()) throw new Error("Chưa nhập tên dự án.");
  return d;
}

// ---------------------------------------------------------------- DANH MỤC
const NHOM_GOC_MUA = () => BEST_CATS;
const nhomCua = (s) => (window.DM_NHOM && DM_NHOM[s]) || (NHOM_GOC_MUA().includes(s) ? "mua" : "loai");
const soSP = (s) => PRODUCTS.filter((p) => p && !p.an && p.cats && p.cats.includes(s)).length;
const taoSlug = (t) => unesc(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
function theDM([s, c]) {
  return `<button class="item post" data-dm="${s}" style="cursor:pointer"><span class="tx"><b>${c.name}</b><span>${soSP(s)} sản phẩm · ${nhomCua(s) === "mua" ? "Theo tên cây" : "Theo loại cây"}</span>
    <span class="chips">${c.an ? `<i class="chip out">Đã xóa</i>` : `<i class="chip">Đang hiện</i>`}</span></span></button>`;
}
function trangDanhMuc() {
  const q = tim.toLowerCase();
  const all = Object.entries(CATEGORIES).filter(([, c]) => unesc(c.name).toLowerCase().includes(q));
  const hien = all.filter(([, c]) => !c.an), xoa = all.filter(([, c]) => c.an);
  const loai = hien.filter(([s]) => nhomCua(s) === "loai"), mua = hien.filter(([s]) => nhomCua(s) === "mua");
  return `<div class="help">Danh mục giúp khách tìm cây trong menu <b>Sản phẩm</b>. Thêm danh mục mới ở đây, rồi vào tab <b>Sản phẩm</b> tick danh mục đó cho từng cây.</div>
    <div class="bar"><input type="search" id="tim" placeholder="Tìm danh mục…" value="${esc(tim)}"><button class="btn" data-moi="dm">+ Thêm danh mục</button></div>
    <h2 class="sub" style="margin-top:4px">Theo loại cây (${loai.length})</h2><div class="list">${loai.map(theDM).join("") || `<div class="empty">Không có</div>`}</div>
    <h2 class="sub">Theo tên cây – mục "Cây mua nhiều" (${mua.length})</h2><div class="list">${mua.map(theDM).join("") || `<div class="empty">Không có</div>`}</div>
    ${xoa.length ? `<h2 class="sub">Đã xóa (${xoa.length}) – bấm để khôi phục</h2><div class="list deleted">${xoa.map(theDM).join("")}</div>` : ""}`;
}
function suaDanhMuc(slug) {
  const moi = slug === "moi", c = moi ? { name: "", intro: "" } : CATEGORIES[slug], n = moi ? "loai" : nhomCua(slug);
  dang = { loai: "dm", id: slug };
  $("dlg").innerHTML = `<div class="dlg-head"><h3>${moi ? "Thêm danh mục mới" : "Sửa danh mục"}</h3><button class="x" data-dong aria-label="Đóng">×</button></div>
  <form class="ed" id="edForm">
    <label class="f">Tên danh mục * <small>Ví dụ: Cây Lan, Bonsai, Cây Ăn Quả</small><input id="fTen" required maxlength="80" value="${esc(unesc(c.name))}"></label>
    <label class="f">Giới thiệu ngắn <small>Hiện ở đầu trang danh mục</small><textarea id="fIntro" rows="3" maxlength="400">${esc(unesc(c.intro))}</textarea></label>
    <div class="f"><b style="font-size:14px">Hiện trong menu Sản phẩm ở cột</b>
      <div class="checks"><label><input type="radio" name="nhom" value="loai"${n === "loai" ? " checked" : ""}> Theo loại cây</label><label><input type="radio" name="nhom" value="mua"${n === "mua" ? " checked" : ""}> Cây mua nhiều (theo tên cây)</label></div></div>
    ${moi ? "" : `<p style="margin:0;font-size:14px;color:var(--muted)">Đang có ${soSP(slug)} sản phẩm trong danh mục này.</p>`}
    <p class="msg" id="edMsg"></p>
    <div class="actions"><div>${moi || c.an ? "" : `<button type="button" class="btn red" data-xoa>Xóa danh mục</button>`}</div>
      <div>${moi || c.an ? "" : `<a class="btn ghost" href="/danh-muc-${slug}/" target="_blank">Xem trên web ↗</a>`}<button class="btn" type="submit" id="edLuu">${c.an ? "Lưu và hiện lại" : "Lưu"}</button></div></div>
  </form>`;
  $("dlg").showModal();
}
function goiDanhMuc() {
  const moi = dang.id === "moi", name = $("fTen").value;
  if (!name.trim()) throw new Error("Chưa nhập tên danh mục.");
  const slug = moi ? taoSlug(name) : dang.id;
  if (!slug) throw new Error("Tên danh mục cần có chữ hoặc số.");
  if (moi && CATEGORIES[slug] && !CATEGORIES[slug].an) throw new Error("Đã có danh mục tên giống vậy.");
  return { moi, slug, name, intro: $("fIntro").value, nhom: (document.querySelector("input[name=nhom]:checked") || {}).value || "loai" };
}

// ---------------------------------------------------------------- KHUNG CHUNG
function ve() {
  const tab = (location.hash.slice(1) || "san-pham");
  document.querySelectorAll("[data-tab]").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  $("main").innerHTML = tab === "khach" ? `<iframe class="khach" src="/quan-tri/khach/" title="Đơn hàng và khách"></iframe>` : tab === "bai-viet" ? trangBaiViet() : tab === "danh-muc" ? trangDanhMuc() : tab === "du-an" ? trangDuAn() : trangSanPham();
}
addEventListener("hashchange", () => { tim = ""; if ($("dlg").open) $("dlg").close(); ve(); });

document.addEventListener("input", (e) => {
  if (e.target.id === "tim") { tim = e.target.value; const pos = e.target.selectionStart; ve(); const t = $("tim"); t.focus(); t.setSelectionRange(pos, pos); }
});
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-sp],[data-bv],[data-dm],[data-da],[data-bogal],[data-moi],[data-dong],[data-xoa]");
  if (!t) return;
  if (t.dataset.sp !== undefined) return suaSanPham(+t.dataset.sp);
  if (t.dataset.bv !== undefined) return suaBaiViet(+t.dataset.bv);
  if (t.dataset.dm !== undefined) return suaDanhMuc(t.dataset.dm);
  if (t.dataset.da !== undefined) return suaDuAn(+t.dataset.da);
  if (t.dataset.bogal !== undefined) { dang.gal.splice(+t.dataset.bogal, 1); return veGal(); }
  if (t.dataset.moi) return t.dataset.moi === "sp" ? suaSanPham("moi") : t.dataset.moi === "dm" ? suaDanhMuc("moi") : t.dataset.moi === "da" ? suaDuAn("moi") : suaBaiViet("moi");
  if (t.dataset.dong !== undefined) return $("dlg").close();
  if (t.dataset.xoa !== undefined) {
    const sp = dang.loai === "sp", dm = dang.loai === "dm", da = dang.loai === "da";
    const hoi = sp ? "Xóa sản phẩm này khỏi trang web?" : da ? "Xóa dự án này khỏi trang web?" : dm ? "Xóa danh mục này khỏi menu? Các sản phẩm bên trong vẫn còn ở danh mục khác." : "Xóa bài viết này khỏi trang web?";
    if (!confirm(hoi + " (Có thể khôi phục lại sau)")) return;
    try {
      if (dm) await gui("/quan-tri/api/danh-muc", { slug: dang.id, xoa: true, name: CATEGORIES[dang.id].name, intro: CATEGORIES[dang.id].intro, nhom: nhomCua(dang.id) });
      else await gui(sp ? "/quan-tri/api/san-pham" : da ? "/quan-tri/api/du-an" : "/quan-tri/api/bai-viet", { id: dang.id, xoa: true });
      xong("Đã xóa");
    }
    catch (err) { $("edMsg").textContent = err.message; }
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "fGal" && e.target.files.length) {
    const nut = $("edLuu"), files = [...e.target.files]; nut.disabled = true; $("edMsg").textContent = "";
    for (let k = 0; k < files.length; k++) {
      $("edMsg").textContent = `Đang tải ảnh ${k + 1}/${files.length}…`;
      try { const j = await gui("/quan-tri/api/anh", { data: await thuNho(files[k]) }); dang.gal.push(j.url); veGal(); }
      catch (err) { $("edMsg").textContent = `Ảnh ${files[k].name}: ${err.message}`; }
    }
    if (/^Đang tải/.test($("edMsg").textContent)) $("edMsg").textContent = "";
    e.target.value = ""; nut.disabled = false; return;
  }
  if (e.target.id !== "fAnh" || !e.target.files[0]) return;
  const nut = $("edLuu"); nut.disabled = true; $("edMsg").textContent = ""; $("pv").textContent = "Đang tải ảnh…";
  try {
    const data = await thuNho(e.target.files[0]);
    const j = await gui("/quan-tri/api/anh", { data });
    dang.img = j.url; $("pv").innerHTML = `<img src="${j.url}" alt="">`;
  } catch (err) { $("pv").textContent = "Lỗi ảnh"; $("edMsg").textContent = err.message; }
  nut.disabled = false;
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "edForm") return;
  e.preventDefault();
  const nut = $("edLuu"); $("edMsg").textContent = "";
  try {
    const L = dang.loai;
    const d = L === "sp" ? goiSanPham() : L === "dm" ? goiDanhMuc() : L === "da" ? goiDuAn() : goiBaiViet();
    nut.disabled = true; nut.textContent = "Đang lưu…";
    await gui({ sp: "/quan-tri/api/san-pham", dm: "/quan-tri/api/danh-muc", da: "/quan-tri/api/du-an", bv: "/quan-tri/api/bai-viet" }[L], d);
    xong("Đã lưu – trang web đã cập nhật");
  } catch (err) { $("edMsg").textContent = err.message; nut.disabled = false; nut.textContent = "Lưu"; }
});
function xong(tb) { sessionStorage.setItem("vx-toast", tb); location.reload(); }

(async () => {
  const t = Date.now();
  await napScript("/data.js?t=" + t);
  await napScript("/noi-dung.js?t=" + t);
  if (typeof PRODUCTS === "undefined") { $("main").innerHTML = `<div class="empty">Không tải được dữ liệu trang web.</div>`; return; }
  ve();
  const tb = sessionStorage.getItem("vx-toast"); if (tb) { sessionStorage.removeItem("vx-toast"); toast(tb); }
})();
</script>
</body>
</html>
